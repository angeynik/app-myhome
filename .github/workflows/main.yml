name: Client - CI

# Проверка клиента (vue-app): установка по pnpm-lock.yaml, ESLint, тесты, production-сборка.
on:
  push:
    branches: [ main, review-fixes ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: vue-app

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager в vue-app/package.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: vue-app/package.json

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: vue-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --no-fix

      - name: Run tests with Jest
        run: pnpm test # покрытие включено в jest.config.js (collectCoverage)

      - name: Build
        run: pnpm build
        env:
          VUE_APP_EXP: localhost
          VUE_APP_PORT: '9202'
          VUE_APP_LOG_LEVEL: warn

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: vue-app/coverage/
          if-no-files-found: ignore
