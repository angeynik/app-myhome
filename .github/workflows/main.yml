name: client-test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest        # дешёвый раннер
    timeout-minutes: 10           # ограничение времени

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'            # кэширует node_modules

      - name: Install dependencies
        run: npm ci               # быстрее, чем npm install

      - name: Run tests
        run: npm test

      - name: Upload coverage (опционально)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
